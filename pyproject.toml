[project]
name = "cubist"
version = "0.1.0"
description = "Agent-native voxel asset authoring: code in, .vox/.glb, renders, and lint out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.13",
]

[project.scripts]
cubist = "cubist.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pygltflib>=1.16.5",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Evaluation scripts are written by agents under test; keep them exactly as authored.
extend-exclude = ["projects/eval/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Asset scripts use `from cubist import *` by design.
"projects/**/*.py" = ["F403", "F405"]
