[project]
name = "cubist"
version = "0.1.0"
description = "Agent-native voxel asset authoring: code in, .vox/.glb, renders, and lint out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Clausen" }]
requires-python = ">=3.11"
keywords = ["voxel", "magicavoxel", "vox", "gltf", "game-assets", "procedural", "mcp", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=1.2",
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/Kalcode/cubist-voxel"
Documentation = "https://github.com/Kalcode/cubist-voxel/tree/main/docs"
Discussions = "https://github.com/Kalcode/cubist-voxel/discussions"

[project.scripts]
cubist = "cubist.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pygltflib>=1.16.5",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 reads the SPDX license and license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Evaluation scripts are written by agents under test; keep them exactly as authored.
extend-exclude = ["projects/eval/assets", "projects/motion/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Asset scripts use `from cubist import *` by design.
"projects/**/*.py" = ["F403", "F405"]
